[package]
name = "wyrmroot-system-init"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "Permanent WYR1 bootfs supervisor"

[lib]
path = "src/lib.rs"

[[bin]]
name = "system-init"
path = "src/main.rs"
test = false
bench = false
required-features = ["native-init"]

[features]
default = []
native-init = []
wyr1-test-evidence = ["native-init", "wyrmroot-runtime/wyr1-test-evidence"]
wyr1b-test-evidence = ["native-init", "wyrmroot-runtime/wyr1b-test-evidence"]
wyr1c4-production = ["native-init"]
wyr1c5-production = ["native-init"]
wyr1c6-production = ["wyr1c5-production"]
wyr1c6-test-evidence = ["native-init", "wyrmroot-runtime/wyr1c6-test-evidence"]
wyr1c6-selector29 = ["wyr1c6-production", "wyr1c6-test-evidence"]
wyr1d-selector32 = ["wyr1c5-production", "dep:wyrmroot-consoled", "wyrmroot-consoled/wyr1d-selector32", "wyrmroot-runtime/wyr1d-test-evidence"]
wyr1e-shell-controller = []
wyr1e-production = ["wyr1c6-production", "wyr1e-shell-controller", "dep:wyrmroot-consoled", "wyrmroot-consoled/wyr1e-wyrmsh"]
wyr1e-selector33 = ["wyr1e-production", "wyrmroot-runtime/wyr1e7-test-evidence"]
wyr1e8-selector33 = [
    "wyr1e-production",
    "dep:wyrmroot-wyr1e-test-actors",
    "wyrmroot-consoled/wyr1e8-recovery",
    "wyrmroot-runtime/wyr1e8-test-evidence",
]
# Reset card R1. Deliberately minimal, like wyr1b-test-evidence: the product
# early-activates only Registryd and Devmgr, so it needs no console, shell or
# recovery feature, and adding one would contradict section 8.1's exclusions.
r1-selector34 = [
    "native-init",
    "dep:wyrmroot-r1-saturation",
    "wyrmroot-runtime/r1-test-evidence",
]
dw1e3-selector31 = [
    "wyr1c5-production",
    "dep:wyrmroot-dw1e3-com2-test",
    "wyrmroot-runtime/dw1e3-test-evidence",
]

[dependencies]
deepwyrm-syscall.workspace = true
wyrmroot-bootfs = { path = "../../crates/wyrmroot-bootfs" }
wyrmroot-device-proto = { path = "../../crates/wyrmroot-device-proto" }
wyrmroot-consoled = { path = "../consoled", optional = true }
wyrmroot-dw1e3-com2-test = { path = "../dw1e3-com2-test", optional = true }
wyrmroot-loader = { path = "../../crates/wyrmroot-loader" }
wyrmroot-launch-proto = { path = "../../crates/wyrmroot-launch-proto" }
wyrmroot-r1-saturation = { path = "../r1-saturation", optional = true }
wyrmroot-registry-proto = { path = "../../crates/wyrmroot-registry-proto" }
wyrmroot-rrc-manifest = { path = "../../crates/wyrmroot-rrc-manifest" }
wyrmroot-runtime = { path = "../../crates/wyrmroot-runtime" }
wyrmroot-wyr1b-gate-proto = { path = "../../crates/wyrmroot-wyr1b-gate-proto" }
wyrmroot-wyr1e-test-actors = { path = "../wyr1e-test-actors", optional = true }

[dev-dependencies]
wyrmroot-bootfs = { path = "../../crates/wyrmroot-bootfs", features = ["builder"] }
wyrmroot-devmgr = { path = "../devmgr", features = ["wyr1e8-production"] }
wyrmroot-rrc-manifest = { path = "../../crates/wyrmroot-rrc-manifest", features = ["builder"] }
wyrmroot-uart16550d = { path = "../uart16550d" }

[lints.rust]
unsafe_code = "deny"
unused_crate_dependencies = "deny"
