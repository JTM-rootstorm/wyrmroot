[package]
name = "wyrmroot-system-init"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "Permanent init: the bootfs supervisor"

[lib]
path = "src/lib.rs"

[[bin]]
name = "system-init"
path = "src/main.rs"
test = false
bench = false
required-features = ["native-init"]

[features]
default = []
native-init = []

[dependencies]
deepwyrm-syscall.workspace = true
wyrmroot-bootfs = { path = "../../crates/wyrmroot-bootfs" }
wyrmroot-device-proto = { path = "../../crates/wyrmroot-device-proto" }
wyrmroot-consoled = { path = "../consoled" }
wyrmroot-loader = { path = "../../crates/wyrmroot-loader" }
wyrmroot-launch-proto = { path = "../../crates/wyrmroot-launch-proto" }
wyrmroot-registry-proto = { path = "../../crates/wyrmroot-registry-proto" }
wyrmroot-rrc-manifest = { path = "../../crates/wyrmroot-rrc-manifest" }
wyrmroot-runtime = { path = "../../crates/wyrmroot-runtime" }

[dev-dependencies]
wyrmroot-bootfs = { path = "../../crates/wyrmroot-bootfs", features = ["builder"] }
wyrmroot-devmgr = { path = "../devmgr" }
wyrmroot-registryd = { path = "../registryd" }
wyrmroot-rrc-manifest = { path = "../../crates/wyrmroot-rrc-manifest", features = ["builder"] }
wyrmroot-uart16550d = { path = "../uart16550d" }

[lints.rust]
unsafe_code = "deny"
unused_crate_dependencies = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("wyrmroot"))'] }
