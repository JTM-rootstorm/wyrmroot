[package]
name = "wyrmroot-dw1b-preemption"
version = "0.0.0"
edition = "2024"
publish = false
description = "Selector-26 normal-preemption payloads and fixed challenge protocol"
license = "GPL-3.0-or-later"

[lib]
path = "src/lib.rs"

[[bin]]
name = "wyrmroot-job-cpu-hog"
path = "src/bin/job_cpu_hog.rs"
test = false
bench = false
required-features = ["native-job-cpu-hog"]

[features]
default = []
native-job-cpu-hog = []

[dependencies]
deepwyrm-syscall.workspace = true
wyrmroot-loader = { path = "../../crates/wyrmroot-loader" }
wyrmroot-runtime = { path = "../../crates/wyrmroot-runtime" }

[lints.rust]
unsafe_code = "deny"
unused_crate_dependencies = "deny"
