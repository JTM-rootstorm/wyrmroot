[package]
name = "wyrmroot-devmgr"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "Resident hardware-independent WYR1-C device coordinator"

[lib]
path = "src/lib.rs"

[[bin]]
name = "devmgr"
path = "src/main.rs"
test = false
bench = false
required-features = ["native-devmgr"]

[features]
default = []
native-devmgr = []

[dependencies]
deepwyrm-syscall.workspace = true
wyrmroot-device-proto = { path = "../../crates/wyrmroot-device-proto" }
wyrmroot-loader = { path = "../../crates/wyrmroot-loader" }
wyrmroot-runtime = { path = "../../crates/wyrmroot-runtime" }
wyrmroot-registry-proto = { path = "../../crates/wyrmroot-registry-proto" }

[dev-dependencies]
wyrmroot-runtime = { path = "../../crates/wyrmroot-runtime", features = ["platform-recording"] }

[lints.rust]
unsafe_code = "deny"
unused_crate_dependencies = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("wyrmroot"))'] }
