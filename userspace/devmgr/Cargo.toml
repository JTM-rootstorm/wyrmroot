[package]
name = "wyrmroot-devmgr"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "Resident hardware-independent WYR1-C device coordinator"

[lib]
path = "src/lib.rs"

[[bin]]
name = "devmgr"
path = "src/main.rs"
test = false
bench = false
required-features = ["native-devmgr"]

[features]
default = []
native-devmgr = [
    "dep:wyrmroot-loader",
    "dep:wyrmroot-registry-proto",
    "dep:wyrmroot-runtime",
]
wyr1c4-production = ["native-devmgr"]
wyr1c5-production = ["native-devmgr"]

[dependencies]
deepwyrm-syscall.workspace = true
wyrmroot-device-proto = { path = "../../crates/wyrmroot-device-proto" }
wyrmroot-loader = { path = "../../crates/wyrmroot-loader", optional = true }
wyrmroot-runtime = { path = "../../crates/wyrmroot-runtime", optional = true }
wyrmroot-registry-proto = { path = "../../crates/wyrmroot-registry-proto", optional = true }

[lints.rust]
unsafe_code = "deny"
unused_crate_dependencies = "deny"
