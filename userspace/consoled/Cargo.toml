[package]
name = "wyrmroot-consoled"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "Bounded WYR1-D serial console supervision model"

[lib]
path = "src/lib.rs"

[[bin]]
name = "consoled"
path = "src/main.rs"
test = false
bench = false
required-features = ["native-consoled"]

[features]
default = []
wyr1d-selector32 = []
wyr1e-wyrmsh = []
wyr1e8-recovery = ["wyr1e-wyrmsh"]
native-consoled = [
    "dep:deepwyrm-syscall",
    "dep:wyrmroot-device-proto",
    "dep:wyrmroot-launch-proto",
    "dep:wyrmroot-loader",
    "dep:wyrmroot-registry-proto",
    "dep:wyrmroot-runtime",
    "dep:wyrmroot-stream-proto",
]

[dependencies]
wyrmroot-console-proto = { path = "../../crates/wyrmroot-console-proto" }

[target.'cfg(target_os = "wyrmroot")'.dependencies]
deepwyrm-syscall = { workspace = true, optional = true }
wyrmroot-device-proto = { path = "../../crates/wyrmroot-device-proto", optional = true }
wyrmroot-launch-proto = { path = "../../crates/wyrmroot-launch-proto", optional = true }
wyrmroot-loader = { path = "../../crates/wyrmroot-loader", optional = true }
wyrmroot-registry-proto = { path = "../../crates/wyrmroot-registry-proto", optional = true }
wyrmroot-runtime = { path = "../../crates/wyrmroot-runtime", optional = true }
wyrmroot-stream-proto = { path = "../../crates/wyrmroot-stream-proto", optional = true }

[lints.rust]
unsafe_code = "deny"
unused_crate_dependencies = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("wyrmroot"))'] }
