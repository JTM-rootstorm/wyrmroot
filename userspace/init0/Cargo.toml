[package]
name = "wyrmroot-init0"
version = "0.0.0"
edition = "2024"
publish = false
description = "Temporary native WYR0 init0 process"
license = "GPL-3.0-or-later"

[lib]
path = "src/lib.rs"

[[bin]]
name = "wyrmroot-init0"
path = "src/main.rs"
test = false
bench = false
required-features = ["native-init0"]

[features]
default = []
native-init0 = []
i2-stress-integration = []
i-capability-integration = ["dep:wyrmroot-i-capability"]
dw1b-preemption-integration = [
    "dep:wyrmroot-dw1b-preemption",
    "wyrmroot-runtime/dw1b-test-evidence",
]
dw1c-preemption-integration = ["wyrmroot-runtime/dw1c-test-evidence"]

[dependencies]
deepwyrm-syscall.workspace = true
wyrmroot-bootfs = { path = "../../crates/wyrmroot-bootfs" }
wyrmroot-loader = { path = "../../crates/wyrmroot-loader" }
wyrmroot-runtime = { path = "../../crates/wyrmroot-runtime" }
wyrmroot-i-capability = { path = "../i-capability", optional = true }
wyrmroot-dw1b-preemption = { path = "../dw1b-preemption", optional = true }

[dev-dependencies]
wyrmroot-bootfs = { path = "../../crates/wyrmroot-bootfs", features = ["builder"] }

[lints.rust]
unsafe_code = "deny"
unused_crate_dependencies = "deny"
