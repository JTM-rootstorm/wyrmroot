[package]
name = "wyrmroot-ext4d"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "Read-write ext4 filesystem service over WRBD, serving WRFS (storage W7)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ext4d"
path = "src/main.rs"
test = false
bench = false
required-features = ["native-ext4d"]

[features]
default = []
native-ext4d = ["dep:wyrmroot-loader"]

[dependencies]
deepwyrm-syscall.workspace = true
wyrmroot-block-proto = { path = "../../crates/wyrmroot-block-proto" }
wyrmroot-ext4 = { path = "../../crates/wyrmroot-ext4" }
wyrmroot-fs-lock = { path = "../../crates/wyrmroot-fs-lock" }
wyrmroot-fs-proto = { path = "../../crates/wyrmroot-fs-proto" }
wyrmroot-loader = { path = "../../crates/wyrmroot-loader", optional = true }
wyrmroot-runtime = { path = "../../crates/wyrmroot-runtime" }
wyrmroot-service = { path = "../../crates/wyrmroot-service" }
wyrmroot-service-proto = { path = "../../crates/wyrmroot-service-proto" }

[dev-dependencies]
wyrmroot-channel-model = { path = "../../crates/wyrmroot-channel-model" }
wyrmroot-loader = { path = "../../crates/wyrmroot-loader" }

[lints.rust]
unsafe_code = "deny"
unused_crate_dependencies = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("wyrmroot"))'] }
