[package]
name = "wyrmroot-registryd"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "Separate fixed-capacity WYR1 bootstrap registry"

[lib]
path = "src/lib.rs"

[[bin]]
name = "registryd"
path = "src/main.rs"
test = false
bench = false
required-features = ["native-registryd"]

[features]
default = []
native-registryd = ["dep:deepwyrm-syscall", "dep:wyrmroot-loader", "dep:wyrmroot-runtime"]

[dependencies]
deepwyrm-syscall = { workspace = true, optional = true }
wyrmroot-loader = { path = "../../crates/wyrmroot-loader", optional = true }
wyrmroot-registry-proto = { path = "../../crates/wyrmroot-registry-proto" }
wyrmroot-runtime = { path = "../../crates/wyrmroot-runtime", optional = true }

[lints.rust]
unsafe_code = "deny"
unused_crate_dependencies = "deny"
