[package]
name = "wyrmroot-bootstrap-proto"
version = "0.0.0"
edition = "2024"
license = "GPL-2.0-or-later"
publish = false
description = "Wyrmroot bootstrap protocol support"

[lib]
path = "src/lib.rs"

# The protocol wire contract is deliberately deferred until the canonical
# Deepwyrm/Wyrmroot bootstrap handoff exists. Keep this crate dependency-free
# and independent from libc/POSIX compatibility layers.

[lints.rust]
unsafe_code = "deny"
unused_crate_dependencies = "deny"
