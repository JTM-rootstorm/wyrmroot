[package]
name = "wyrmroot-runtime"
version = "0.0.0"
edition = "2024"
license = "GPL-2.0-or-later"
publish = false
description = "Minimal native runtime support for Wyrmroot"

[lib]
path = "src/lib.rs"

[dependencies]
deepwyrm-abi.workspace = true

# Native guest runtime support remains directly layered on generated
# Deepwyrm definitions. The separate G1B consumer crate will supply the raw
# syscall boundary without introducing libc or POSIX compatibility.

[lints.rust]
unsafe_code = "deny"
unused_crate_dependencies = "deny"
