[package]
name = "wyrmroot-channel-model"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "Host-only in-memory model of Deepwyrm Channels, waits, clocks and MemoryObjects for service tests"

[lib]
path = "src/lib.rs"

[dependencies]
deepwyrm-syscall.workspace = true
wyrmroot-block-proto = { path = "../wyrmroot-block-proto" }
wyrmroot-loader = { path = "../wyrmroot-loader" }
wyrmroot-registry-proto = { path = "../wyrmroot-registry-proto" }
wyrmroot-runtime = { path = "../wyrmroot-runtime" }
wyrmroot-service-proto = { path = "../wyrmroot-service-proto" }

[lints.rust]
unsafe_code = "forbid"
unused_crate_dependencies = "deny"
