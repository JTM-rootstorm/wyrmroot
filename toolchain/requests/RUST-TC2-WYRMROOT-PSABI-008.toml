[requirement]
phase_gate = "TOOLCHAIN_PLAN.md step 2 prerequisite D2 (TOOLCHAIN_LLVM_FORK_RULES.md O4)"
consumer_repository = "wyrmroot"
consumer_revision = "the Wyrmroot commit containing this exact request record"
expected_behavior = "x86_64-unknown-wyrmroot uses the SysV x86-64 psABI: no soft-float ABI and no disabled features, so it advertises exactly the x86-64 baseline (x87, fxsr, sse, sse2) and passes float and double in SSE registers, matching clang's x86_64-unknown-wyrmroot from LLVM-TC2-WYRMROOT-PSABI-002. Safe only on Deepwyrm 948cc7e or later, which saves each user thread's x87/SSE/AVX state."
consumer_checks = [
    "tools/pinned-cargo xtask dev-boot --check",
    "tools/pinned-cargo xtask dev-boot --check --smp",
    "<accepted-rustc> --print cfg --target x86_64-unknown-wyrmroot",
]

