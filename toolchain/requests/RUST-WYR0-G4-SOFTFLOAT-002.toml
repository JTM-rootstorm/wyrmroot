notes = "The Rust checkout contains no repository-local AGENTS.md, so the workspace policy governed the isolated lane and canonical integration. The change disables hardware FP/vector code generation for the native target; it does not add std, alloc, TLS, unwinding, libc, CRT, a dynamic linker, Unix-family membership, or runtime FP emulation."
