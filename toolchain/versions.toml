schema_version = 1
milestone = "WYR0"

# The canonical Deepwyrm pin record. `revision` is the exact commit whose
# generated deepwyrm-abi and deepwyrm-syscall crates Wyrmroot compiles against,
# kept as provenance. `abi_fingerprint` is that commit's semantic ABI
# fingerprint (abi/generated/abi_fingerprint.toml), and the revision-pairing
# gates accept any kernel revision that carries it, so a documentation-only
# schema edit needs no repin. Cargo.toml and Cargo.lock must restate
# `revision`; a host test checks them, and every other site derives the pin.
[deepwyrm]
repository = "https://github.com/JTM-rootstorm/deepwyrm"
revision = "152842e969a895820a4f7e7bb159e8125cf5381d"
abi_fingerprint = "3b59617c479d2d28e3580ef3317a18c4a64831011a960fe23eafd465bd199b6e"
abi_version = 0
abi_dependency_state = "available"

[rust]
upstream_repository = "https://github.com/rust-lang/rust"
upstream_stable_release = "1.97.1"
upstream_stable_revision = "8bab26f4f68e0e26f0bb7960be334d5b520ea452"
fork_repository = "git@github.com:JTM-rootstorm/rust.git"
wyrmroot_revision = "a92dc7f7464ad6ddfece4402bd7b86dbfa86166d"
local_toolchain_name = "wyrmroot-1.97.1-a92dc7f7"
accepted_artifact_root = "artifacts/toolchains/accepted/RUST-WYR0-I-B-SYSROOTS-007"
project_cargo_home = ".tmp/cargo-home/offline-v1"
native_target = "x86_64-unknown-wyrmroot"
native_target_state = "available"

[llvm]
canonical_c_compiler = "clang"
canonical_cxx_compiler = "clang++"
canonical_linker = "ld.lld"
canonical_compiler_runtime = "compiler-rt"
canonical_archiver = "llvm-ar"
canonical_object_tools = [
    "llvm-readelf",
    "llvm-readobj",
    "llvm-objdump",
    "llvm-nm",
    "llvm-objcopy",
    "llvm-pdbutil",
    "llvm-symbolizer",
]
canonical_debugger = "gdb"
host_version_state = "not-yet-adopted"
host_availability_probe = "sh toolchain/verify-host-tools.sh --json"

[bootstrap_constraints]
allow_moving_rust_channel = false
allow_host_target_defaults_for_guest = false
allow_host_libc_for_guest = false
allow_unimplemented_deepwyrm_abi_dependency = false
allow_unimplemented_native_target = false
