# Warn-level lint ratchet baseline (structural refactor S1.3).
#
# `tools/pinned-cargo xtask test host lint-ratchet` (and the unfiltered run)
# lints every shape a clippy gate reaches with these two lints at warn level,
# counts each site once per package, and fails if any count rises above this
# file. When a count falls the gate prints the new counts; lower this file in
# the change that fixed the sites. Measured 2026-09-23.
#
# 2026-09-27: consoled and uart16550d entered at 12 and 1. Their role binaries
# gained a host build (S2U.2) and `wyr1f-role-clippy` now lints them, so these
# are existing `main.rs` sites seen for the first time, not new ones.
#
# 2026-09-28: consoled rose to 13. S2U.3 moved its role verbatim into the
# library, which the selector-32 library clippy shape lints, so
# recover_terminal_child's pre-existing `_ => return Err(61)` (the non-wyrmsh
# arm) is newly visible there, not new.

[undocumented_unsafe_blocks]
xtask = 2

[wildcard_enum_match_arm]
wyrmroot-bootfs = 1
wyrmroot-bootstrap = 4
wyrmroot-console-proto = 1
wyrmroot-consoled = 13
wyrmroot-device-proto = 9
wyrmroot-devmgr = 5
wyrmroot-loader = 3
wyrmroot-registryd = 3
wyrmroot-runtime = 12
wyrmroot-system-init = 39
wyrmroot-uart16550d = 1
wyrmroot-wyr1b-gate = 2
wyrmroot-wyr1b-gate-proto = 4
wyrmroot-wyrmsh = 14
wyrmroot-wyrmsh-core = 1
xtask = 15
