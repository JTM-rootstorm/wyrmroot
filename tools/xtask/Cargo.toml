[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
publish = false

[dependencies]
deepwyrm-abi.workspace = true
wyrmroot-bootfs = { path = "../../crates/wyrmroot-bootfs", features = ["builder"] }
wyrmroot-device-proto = { path = "../../crates/wyrmroot-device-proto" }
wyrmroot-ext4 = { path = "../../crates/wyrmroot-ext4" }
wyrmroot-loader = { path = "../../crates/wyrmroot-loader" }
wyrmroot-rrc-manifest = { path = "../../crates/wyrmroot-rrc-manifest", features = ["builder"] }

[dev-dependencies]
# Host-only, and only so the gate-config encoder can be round-tripped through
# the actual `parse_gate_config` rather than a re-spelling of it.
wyrmroot-system-init = { path = "../../userspace/system-init" }
