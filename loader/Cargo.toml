[package]
name = "wyrmroot-efi-loader"
version = "0.0.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
description = "Inert scaffold for the future Wyrmroot EFI loader"

[features]
default = []
firmware = ["dep:uefi"]

[lib]
path = "src/lib.rs"
doctest = false
test = false
bench = false

[[bin]]
name = "loader"
path = "src/main.rs"
test = false
bench = false
required-features = ["firmware"]

[dependencies]
deepwyrm-abi.workspace = true
uefi = { workspace = true, optional = true }
