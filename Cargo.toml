[workspace]
resolver = "3"
members = [
    "bootstrap",
    "crates/wyrmroot-bootfs",
    "crates/wyrmroot-bootstrap-proto",
    "crates/wyrmroot-loader",
    "crates/wyrmroot-runtime",
    "loader",
    "tools/xtask",
    "userspace/hello",
    "userspace/init0",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/JTM-rootstorm/wyrmroot"

[workspace.dependencies]
deepwyrm-abi = { git = "https://github.com/JTM-rootstorm/deepwyrm.git", rev = "4751a2d3929675357e31389301d152f86e2ab7cb" }
