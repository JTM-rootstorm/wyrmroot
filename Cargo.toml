[workspace]
resolver = "3"
members = [
    "bootstrap",
    "crates/wyrmroot-bootfs",
    "crates/wyrmroot-bootstrap-proto",
    "crates/wyrmroot-loader",
    "crates/wyrmroot-runtime",
    "loader",
    "tools/xtask",
    "userspace/hello",
    "userspace/init0",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-2.0-or-later"
repository = "https://github.com/JTM-rootstorm/wyrmroot"

[workspace.dependencies]
deepwyrm-abi = { git = "https://github.com/JTM-rootstorm/deepwyrm.git", rev = "c0e0c20bc1e48a23172629ecfec9b2219a479425" }
deepwyrm-syscall = { git = "https://github.com/JTM-rootstorm/deepwyrm.git", rev = "c0e0c20bc1e48a23172629ecfec9b2219a479425" }
uefi = { version = "=0.39.0", default-features = false, features = ["alloc", "global_allocator", "panic_handler"] }
