[workspace]
resolver = "3"
members = [
    "bootstrap",
    "crates/wyrmroot-block-proto",
    "crates/wyrmroot-bootfs",
    "crates/wyrmroot-bootstrap-proto",
    "crates/wyrmroot-channel-model",
    "crates/wyrmroot-console-proto",
    "crates/wyrmroot-device-proto",
    "crates/wyrmroot-ext4",
    "crates/wyrmroot-fat",
    "crates/wyrmroot-fs-proto",
    "crates/wyrmroot-fs-lock",
    "crates/wyrmroot-loader",
    "crates/wyrmroot-launch-proto",
    "crates/wyrmroot-partition",
    "crates/wyrmroot-registry-proto",
    "crates/wyrmroot-rrc-manifest",
    "crates/wyrmroot-service",
    "crates/wyrmroot-service-proto",
    "crates/wyrmroot-startup-proto",
    "crates/wyrmroot-runtime",
    "crates/wyrmroot-stream-proto",
    "crates/wyrmroot-uart16550-core",
    "crates/wyrmroot-wyrmsh-core",
    "loader",
    "tools/xtask",
    "userspace/hello",
    "userspace/system-init",
    "userspace/registryd",
    "userspace/devmgr",
    "userspace/uart16550d",
    "userspace/virtio-blkd",
    "userspace/blockmgr",
    "userspace/fat32d",
    "userspace/ext4d",
    "userspace/vfsd",
    "userspace/consoled",
    "userspace/wyrmsh",
    "userspace/cpu-hog",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-2.0-or-later"
repository = "https://github.com/JTM-rootstorm/wyrmroot"

[workspace.dependencies]
deepwyrm-abi = { git = "https://github.com/JTM-rootstorm/deepwyrm.git", rev = "94ad17eb6b7eaeb3049389d605eadc62c03b2103" }
deepwyrm-syscall = { git = "https://github.com/JTM-rootstorm/deepwyrm.git", rev = "94ad17eb6b7eaeb3049389d605eadc62c03b2103" }
uefi = { version = "=0.39.0", default-features = false, features = ["alloc", "global_allocator", "panic_handler"] }

# Host tooling hashes multi-GB toolchains and images. Unoptimized, xtask's
# SHA-256 runs at ~33 MB/s and dominated every product freeze. Optimize the
# host-side packages only; debug assertions and overflow checks stay on, and
# guest products build with the release profile, which this does not touch.
[profile.dev.package.xtask]
opt-level = 3

[profile.dev.package.wyrmroot-bootfs]
opt-level = 3

[profile.dev.package.wyrmroot-rrc-manifest]
opt-level = 3

[profile.dev.package.wyrmroot-loader]
opt-level = 3
