[package]
name = "wyrmroot-bootstrap"
version = "0.0.0"
edition = "2024"
publish = false
description = "Primordial Wyrmroot bootstrap application"
license = "GPL-3.0-or-later"

[lib]
path = "src/lib.rs"

[[bin]]
name = "wyrmroot-bootstrap"
path = "src/main.rs"
test = false
bench = false
required-features = ["native-bootstrap"]

[features]
default = []
native-bootstrap = []
wyr0-init0-integration = ["native-bootstrap"]
dw1c-bootstrap-supervision = ["wyr0-init0-integration"]
loader-smoke-integration = []
native-loader-smoke-integration = ["native-bootstrap", "loader-smoke-integration"]
primordial-test-support = ["wyrmroot-runtime/primordial-test-support"]
primordial-blocking-cleanup = ["native-bootstrap", "primordial-test-support"]
primordial-user-exception = ["native-bootstrap", "primordial-test-support"]
primordial-invalid-return = ["native-bootstrap", "primordial-test-support"]
i0-negative-malformed-elf = ["native-bootstrap"]
i0-negative-malformed-startup = ["native-bootstrap"]
i0-negative-capability-count = ["native-bootstrap"]
i0-negative-capability-type = ["native-bootstrap"]
i0-negative-capability-rights = ["native-bootstrap"]
i-capability-relay = []
i-capability-integration = ["native-bootstrap", "i-capability-relay"]
dw1d6-synthetic = ["native-bootstrap", "wyrmroot-runtime/dw1d6-test-evidence", "dep:wyrmroot-dw1d6-device-test"]

[dependencies]
deepwyrm-syscall.workspace = true
wyrmroot-bootfs = { path = "../crates/wyrmroot-bootfs" }
wyrmroot-bootstrap-proto = { path = "../crates/wyrmroot-bootstrap-proto" }
wyrmroot-loader = { path = "../crates/wyrmroot-loader" }
wyrmroot-runtime = { path = "../crates/wyrmroot-runtime" }
wyrmroot-dw1d6-device-test = { path = "../userspace/dw1d6-device-test", optional = true }

[dev-dependencies]
wyrmroot-bootfs = { path = "../crates/wyrmroot-bootfs", features = ["builder"] }

[lints.rust]
unsafe_code = "deny"
unused_crate_dependencies = "deny"
